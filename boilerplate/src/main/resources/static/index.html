<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Explorer & Products</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-4">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-[#151c33] p-5 rounded-2xl border border-slate-800 gap-4 shadow-2xl">
            <div>
                <h1 class="text-xl font-bold text-[#818cf8] flex items-center gap-2">
                    <i class="fa-solid fa-flask"></i> Rick and Morty Explorer & Products
                </h1>
                <p class="text-slate-400 text-xs mt-1">Consuming external APIs + Spring Boot Backend Proxy</p>
            </div>

            <!-- Tab navigation -->
            <div class="flex gap-1.5 bg-[#0b1329] p-1.5 rounded-xl border border-slate-800 text-xs font-semibold">
                <button onclick="switchEndpoint('characters')" id="btnTabCharacters" class="px-4 py-2 rounded-lg bg-[#6366f1] text-white shadow transition">Characters</button>
                <button onclick="switchEndpoint('locations')" id="btnTabLocations" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Locations</button>
                <button onclick="switchEndpoint('episodes')" id="btnTabEpisodes" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Episodes</button>
                <button onclick="switchEndpoint('products')" id="btnTabProducts" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Local Products</button>
            </div>
        </header>

        <!-- CRUD Form for Local Products (Hidden by default) -->
        <section id="productFormSection" class="hidden bg-[#151c33] p-5 rounded-2xl border border-slate-800 shadow-xl">
            <h2 id="formTitle" class="text-sm font-semibold text-[#818cf8] mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Add New Product
            </h2>
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="hidden" id="productId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Name</label>
                    <input type="text" id="name" required placeholder="e.g. Gaming Monitor" class="w-full px-3 py-2 bg-[#0b1329] border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Description</label>
                    <input type="text" id="description" required placeholder="e.g. IPS 144Hz 1ms" class="w-full px-3 py-2 bg-[#0b1329] border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Price ($)</label>
                    <input type="number" step="0.01" id="price" required placeholder="0.00" class="w-full px-3 py-2 bg-[#0b1329] border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Image URL</label>
                    <input type="url" id="image" placeholder="https://..." class="w-full px-3 py-2 bg-[#0b1329] border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>

                <div class="lg:col-span-4 flex justify-end gap-3 pt-2">
                    <button type="button" onclick="resetForm()" id="btnCancel" class="hidden px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg text-xs font-semibold transition">
                        Cancel
                    </button>
                    <button type="submit" id="btnSave" class="px-5 py-2 bg-[#6366f1] hover:bg-indigo-600 text-white rounded-lg text-xs font-semibold shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Save Product
                    </button>
                </div>
            </form>
        </section>

        <!-- Search bar -->
        <section class="bg-[#151c33] p-3 rounded-2xl border border-slate-800 shadow-xl flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Type to search (waits 4.5s automatically)..." 
                    class="w-full pl-11 pr-4 py-2 bg-[#0b1329] border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 text-xs text-slate-200 placeholder-slate-500">
            </div>
        </section>

        <!-- Main Card Grid -->
        <main id="catalogView" class="pt-2">
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                <!-- Cards injected dynamically -->
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#151c33] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-800 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span id="modalBadge" class="text-[11px] font-bold px-2.5 py-1 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">CATEGORY</span>
                <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-slate-400 hover:text-white text-lg transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="flex flex-col items-center space-y-3">
                <img id="modalImage" src="" alt="Detail" class="w-full h-52 object-cover rounded-xl border border-slate-800/80 hidden">
                <div class="w-full space-y-2 text-left">
                    <h3 id="modalTitle" class="text-lg font-bold text-white">Item Name</h3>
                    <p id="modalSubtitle" class="text-slate-400 text-xs leading-relaxed">Description...</p>
                    <div id="modalExtra" class="pt-3 border-t border-slate-800 text-xs text-slate-300 space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Modular JavaScript -->
    <script type="module">
        import { searchWithDebounce, loadTab } from './js/api.js';
        import { renderGrid, openModal } from './js/ui.js';

        window.renderGrid = renderGrid;
        window.openModal = openModal;
        window.currentTab = 'characters';

        // Tab Switching Logic
        window.switchEndpoint = (tab) => {
            window.currentTab = tab;
            document.getElementById('searchInput').value = '';
            
            // Show/Hide Form based on active tab
            const formSection = document.getElementById('productFormSection');
            if (tab === 'products') {
                formSection.classList.remove('hidden');
            } else {
                formSection.classList.add('hidden');
            }
            
            resetForm();
            loadTab(tab, (items) => renderGrid(items, tab));
        };

        // Search Event Listener (Debounced in api.js)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            document.getElementById('productsGrid').innerHTML = '<div class="col-span-full text-center text-indigo-400">Searching in 4.5s...</div>';
            searchWithDebounce(window.currentTab, query, (items) => renderGrid(items, window.currentTab));
        });

        // --- CRUD Functions ---
        window.prepareEdit = (id, name, description, price, image) => {
            document.getElementById('productId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('description').value = description;
            document.getElementById('price').value = price;
            document.getElementById('image').value = image;
            
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-400"></i> Edit Product #' + id;
            document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-rotate"></i> Update Product';
            document.getElementById('btnCancel').classList.remove('hidden');
            
            document.getElementById('productFormSection').scrollIntoView({ behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add New Product';
            document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Product';
            document.getElementById('btnCancel').classList.add('hidden');
        };

        window.deleteProduct = async (id) => {
            if (confirm('Are you sure you want to delete product #' + id + '?')) {
                await fetch('/api/products/' + id, { method: 'DELETE' });
                loadTab('products', (items) => renderGrid(items, 'products'));
            }
        };

        // Form Submit (Create / Update)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const productData = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                image: document.getElementById('image').value
            };

            const isEdit = id !== '';
            const url = isEdit ? '/api/products/' + id : '/api/products';
            const method = isEdit ? 'PUT' : 'POST';

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });

            resetForm();
            loadTab('products', (items) => renderGrid(items, 'products'));
        });

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            loadTab(window.currentTab, (items) => renderGrid(items, window.currentTab));
        });
    </script>
</body>
</html>
