<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Explorer & Products</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-4">
        
        <!-- Header con tema oscuro -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-[#151c33] p-5 rounded-2xl border border-slate-800 gap-4 shadow-2xl">
            <div>
                <h1 class="text-xl font-bold text-[#818cf8] flex items-center gap-2">
                    <i class="fa-solid fa-flask"></i> Rick and Morty Explorer & Products
                </h1>
                <p class="text-slate-400 text-xs mt-1">Consuming 3 external endpoints + Spring Boot API</p>
            </div>

            <!-- Navegación estilo Pestañas de la imagen -->
            <div class="flex gap-1.5 bg-[#0b1329] p-1.5 rounded-xl border border-slate-800 text-xs font-semibold">
                <button class="px-4 py-2 rounded-lg bg-[#6366f1] text-white shadow transition">
                    Characters
                </button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">
                    Locations
                </button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">
                    Episodes
                </button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">
                    Local Products
                </button>
            </div>
        </header>

        <!-- Barra de búsqueda oscura -->
        <section class="bg-[#151c33] p-3 rounded-2xl border border-slate-800 shadow-xl">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" onkeyup="filterCharacters()" placeholder="Type to search (wait 4.5s automatically)..." 
                    class="w-full pl-11 pr-4 py-2 bg-[#0b1329] border border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 text-xs text-slate-200 placeholder-slate-500">
            </div>
        </section>

        <!-- Grid de Tarjetas -->
        <main id="catalogView" class="pt-2">
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                <!-- Cargado dinámicamente -->
            </div>
        </main>

    </div>

    <script>
        let allCharacters = [];

        document.addEventListener('DOMContentLoaded', fetchRickAndMortyData);

        async function fetchRickAndMortyData() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm"><i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i><br>Cargando catálogo...</div>`;

            try {
                // Consumo directo de la API
                const response = await fetch('https://rickandmortyapi.com/api/character');
                if (!response.ok) throw new Error('Error de conexión');
                
                const data = await response.json();
                
                // Mapeo directo de atributos de la API
                allCharacters = data.results.map(c => ({
                    id: c.id,
                    name: c.name,
                    image: c.image,
                    status: c.status,
                    species: c.species,
                    price: (c.id * 3.5 + 12).toFixed(2),
                    stock: 5 + c.id
                }));

                renderGrid(allCharacters);
            } catch (error) {
                console.error('Error al cargar datos:', error);
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 text-sm">No se pudieron cargar los datos de la API.</div>`;
            }
        }

        function renderGrid(characters) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (characters.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">No se encontraron resultados.</div>`;
                return;
            }

            characters.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-[#151c33] rounded-2xl p-4 border border-slate-800 hover:border-indigo-500/50 transition shadow-lg flex flex-col justify-between group";

                card.innerHTML = `
                    <div class="space-y-3">
                        <!-- Imagen devuelta por la API -->
                        <img src="${item.image}" alt="${item.name}" class="w-full h-44 object-cover rounded-xl border border-slate-800/80">
                        
                        <!-- Nombre del Personaje -->
                        <h3 class="font-bold text-white text-sm group-hover:text-indigo-400 transition line-clamp-1">${item.name}</h3>
                        
                        <!-- Detalle Estado/Especie -->
                        <p class="text-[11px] text-slate-400 line-clamp-1">Especie: ${item.species} | Estado: ${item.status}</p>
                    </div>

                    <div class="pt-3 mt-3 border-t border-slate-800/80 flex justify-between items-center text-xs">
                        <!-- Precio e ID -->
                        <span class="text-emerald-400 font-bold text-xs">$${item.price}</span>
                        <span class="text-slate-500 font-mono text-[11px]">#${item.id}</span>
                    </div>

                    <!-- Botones de Acción Estilizados Oscuros -->
                    <div class="flex gap-2 mt-3 pt-2">
                        <button onclick="editItem(${item.id})" class="w-1/2 py-1.5 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 border border-amber-500/20 rounded-lg text-xs font-medium transition">
                            Editar
                        </button>
                        <button onclick="deleteItem(${item.id})" class="w-1/2 py-1.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 rounded-lg text-xs font-medium transition">
                            Eliminar
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCharacters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allCharacters.filter(c => c.name.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function editItem(id) {
            alert(`Editar personaje #${id}`);
        }

        function deleteItem(id) {
            if (confirm(`¿Eliminar personaje #${id}?`)) {
                allCharacters = allCharacters.filter(c => c.id !== id);
                renderGrid(allCharacters);
            }
        }
    </script>
</body>
</html>
