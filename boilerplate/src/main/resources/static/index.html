    <!-- Load our modular JavaScript -->
    <script type="module">
        import { searchWithDebounce, loadTab } from './js/api.js';
        import { renderGrid, closeModal } from './js/ui.js';

        // Make closeModal globally available for the HTML button
        window.closeModal = closeModal;

        // Search listener with Debounce
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            searchWithDebounce('characters', query, (items) => renderGrid(items, 'characters'));
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadTab('characters', (items) => renderGrid(items, 'characters'));
        });
    </script>
</body>
</html>
